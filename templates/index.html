<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu Sistema de Estudos</title>
<meta name="theme-color" content="#2563eb">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  (function () {
    try {
      var t = localStorage.getItem("tema");
      if (t === "claro") document.documentElement.setAttribute("data-theme", "light");
      else if (t === "escuro") document.documentElement.setAttribute("data-theme", "dark");
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/responsive.css') }}">
</head>
<body>
<div id="auth-screen" hidden>
  <div class="auth-card">
    <span class="brand-mark" style="width:40px;height:40px;font-size:15px;border-radius:10px;margin-bottom:8px;">ME</span>
    <h1 id="auth-titulo">Meu Sistema de Estudos</h1>
    <p class="field-hint" id="auth-subtitulo">Entre com sua conta para continuar.</p>

    <form id="form-auth">
      <div class="field" id="auth-campo-nome" hidden><label for="auth-nome">Nome</label><input id="auth-nome" autocomplete="name"></div>
      <div class="field"><label for="auth-email">E-mail</label><input id="auth-email" type="email" required autocomplete="username"></div>
      <div class="field"><label for="auth-senha">Senha</label><input id="auth-senha" type="password" required autocomplete="current-password"></div>
      <p class="field-hint" id="auth-erro" style="color:var(--danger); display:none;"></p>
      <button type="submit" class="btn btn-primary btn-block" id="auth-submit">Entrar</button>
    </form>

    <button type="button" class="btn btn-block" id="auth-alternar" style="margin-top:var(--space-2);">Não tem conta? Cadastre-se</button>
  </div>
</div>

<div id="app-shell" hidden>
  <header id="topbar">
    <div class="brand"><span class="brand-mark">ME</span> <span>Meu Sistema de Estudos</span></div>
    <div class="actions">
      <span id="usuario-nome" class="field-hint"></span>
      <button id="theme-toggle" class="icon-btn" type="button" aria-label="Alternar tema" title="Alternar tema"></button>
      <button id="logout-btn" class="icon-btn" type="button" aria-label="Sair" title="Sair"></button>
    </div>
  </header>

  <div id="layout">
    <nav id="sidebar" aria-label="Navegação principal">
      <div class="brand"><span class="brand-mark">ME</span> <span class="brand-text">Meus Estudos</span></div>
      <div id="sidebar-items"></div>
    </nav>

    <main id="view" role="main"></main>
  </div>

  <nav id="bottom-nav" aria-label="Navegação principal"></nav>
  <button id="fab" type="button" aria-label="Adicionar" title="Adicionar" hidden></button>
</div>

<div id="modal-root" hidden aria-hidden="true"></div>
<div id="toast" role="status" aria-live="polite"></div>

<input type="file" id="import-file-input" accept=".xlsx" hidden>

<script src="{{ url_for('static', filename='js/api.js') }}"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
<script src="{{ url_for('static', filename='js/disciplinas.js') }}"></script>
<script src="{{ url_for('static', filename='js/avaliacoes.js') }}"></script>
<script src="{{ url_for('static', filename='js/tarefas.js') }}"></script>
<script src="{{ url_for('static', filename='js/calendario.js') }}"></script>
<script src="{{ url_for('static', filename='js/estudos.js') }}"></script>
<script src="{{ url_for('static', filename='js/pomodoro.js') }}"></script>
<script src="{{ url_for('static', filename='js/estatisticas.js') }}"></script>
<script src="{{ url_for('static', filename='js/grade.js') }}"></script>
</body>
</html>
